name: Daily Nature Image Poster

on:
  schedule:
    - cron: '30 4 * * *' # Roz subah 10:00 AM IST chalega
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # ⚠️ Yahan icrawler add kiya gaya hai
        run: pip install requests icrawler 

      - name: Run Python Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_SUCCESS_BOT_TOKEN: ${{ secrets.TELEGRAM_SUCCESS_BOT_TOKEN }}
          TELEGRAM_SUCCESS_CHAT_ID: ${{ secrets.TELEGRAM_SUCCESS_CHAT_ID }}
          TELEGRAM_ERROR_BOT_TOKEN: ${{ secrets.TELEGRAM_ERROR_BOT_TOKEN }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated 30-day cooldown history" && git push)
