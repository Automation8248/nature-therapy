name: USA Daily Auto Poster

on:
  schedule:
    # Yeh rozana UTC time 01:00 AM par chalega (India ke 6:30 AM / USA ke 8:00 PM EST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Isse aap manually bhi "Run workflow" daba kar test kar sakte hain

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    # Ye permission zaroori hai taaki script delete hui images ko GitHub par wapas save kar sake
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Agar aapne requirements.txt nahi banayi hai, toh direct requests install kar dega
        run: pip install requests

      - name: Run Auto Poster Script
        env:
          # GitHub Secrets se data nikaal kar Python (os.getenv) ko dega
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_SUCCESS_BOT_TOKEN: ${{ secrets.TELEGRAM_SUCCESS_BOT_TOKEN }}
          TELEGRAM_SUCCESS_CHAT_ID: ${{ secrets.TELEGRAM_SUCCESS_CHAT_ID }}
          TELEGRAM_ERROR_BOT_TOKEN: ${{ secrets.TELEGRAM_ERROR_BOT_TOKEN }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # -A ka matlab hai saare changes (update hui history aur delete hui image) ko stage karna
          git add -A
          
          # Agar kuch change hua hai (file delete ya history update), tabhi commit karega
          git diff --staged --quiet || git commit -m "Auto-update: updated history and removed used image"
          
          # Changes ko repository mein push karega
          git push
