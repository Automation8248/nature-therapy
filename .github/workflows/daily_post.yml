name: USA Daily Auto Poster

on:
  schedule:
    # Yeh rozana UTC time 01:00 AM par chalega (India ke 6:30 AM / USA ke 8:00 PM)
    - cron: '0 1 * * *'
  workflow_dispatch: # Isse aap manually bhi "Run workflow" button daba kar test kar sakte hain

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    # Ye permission zaroori hai taaki script delete hui images ko GitHub par save kar sake
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Auto Poster Script
        run: python main.py

      - name: Commit and Push Changes (Save history & remove used images)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json images/
          # Agar koi image delete hui hai ya history update hui hai, tabhi commit karega
          git diff --staged --quiet || git commit -m "Auto-update: updated history and removed used image"
          git push
